summary: Submit ComfyUI prompts and post comfy_prompt receipts (procedure version 1)
description: >-
  infernix-hub generation procedure, version 1. One ComfyUI /prompt per variant
  with the hub-chosen prompt_id and client_id, then an immediate comfy_prompt
  receipt to the hub. An ambiguous /prompt failure is reconciled through
  /history and /queue and never resubmitted. Receipt posts retry 3 times.
version: 1
kind: script
lock: ""
tag: hub
schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  type: object
  properties:
    request_version:
      type: integer
      const: 1
    generation_request_id:
      type: string
    windmill_path:
      type: string
    engine_instance_id:
      type: string
    engine_base_url:
      type: string
    prompts:
      type: array
      items: {}
    prompt_ids:
      type: array
      items:
        type: string
    comfy_client_id:
      type: string
    receipt_url:
      type: string
  required:
    - request_version
    - generation_request_id
    - engine_instance_id
    - engine_base_url
    - prompts
    - prompt_ids
    - comfy_client_id
    - receipt_url
