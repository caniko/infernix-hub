summary: Dispatch an armed publication timer (procedure version 1)
description: >-
  infernix-hub publication timer, version 1. Posts
  {schedule_revision, trigger_id: WM_JOB_ID} to the hub dispatch URL with the
  f/infernix_hub/hub_token bearer. HTTP 409 stale_schedule_revision or
  already_claimed is a successful no-op; the hub owns publishing decisions.
version: 1
kind: script
lock: ""
tag: hub
schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  type: object
  properties:
    intent_id:
      type: string
    schedule_revision:
      type: integer
    due_at:
      type: string
      format: date-time
    dispatch_url:
      type: string
  required:
    - intent_id
    - schedule_revision
    - due_at
    - dispatch_url
