[package]
name = "hub-integrations"
description = "Live and fixture adapters for Paperclip, Windmill, ComfyUI, publishing transports, n8n, and the local asset store."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
contracts = { workspace = true, features = ["client"] }
domain.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
mail-parser = { version = "0.11.1", features = ["full_encoding"] }
reqwest.workspace = true
ring.workspace = true
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tracing.workspace = true
uuid.workspace = true
webpki-roots = "1"
