[package]
name = "hub-contracts"
description = "Versioned JSON wire contracts shared by the hub API, worker, desktop UI and CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
client = ["dep:reqwest"]

[dependencies]
chrono.workspace = true
# One fleet snapshot type shared by the tool that writes it and every surface
# that reads it; no CLI/Pkl features belong in the hub.
fleetix = { version = "0.10.1", default-features = false }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
