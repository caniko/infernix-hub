[package]
name = "infernix-hub-desktop"
description = "Local-first operator console for the infernix-hub content operations hub."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
contracts = { workspace = true, features = ["client"] }
# Newest published 0.8 alpha (crates.io, 2026-11-09). The desktop feature is
# additive to the default feature set, so no `dx` CLI is required for cargo.
dioxus = { version = "=0.8.0-alpha.3", features = ["desktop"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
