[workspace]
resolver = "3"
members = [
    "apps/cli",
    "apps/desktop",
    "crates/api",
    "crates/contracts",
    "crates/domain",
    "crates/integrations",
    "crates/worker",
]
# The desktop app pulls the webkit stack; native checks build without it.
default-members = [
    "apps/cli",
    "crates/api",
    "crates/contracts",
    "crates/domain",
    "crates/integrations",
    "crates/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
contracts = { path = "crates/contracts", package = "hub-contracts" }
domain = { path = "crates/domain", package = "hub-domain" }
integrations = { path = "crates/integrations", package = "hub-integrations" }
worker = { path = "crates/worker", package = "hub-worker" }
api = { path = "crates/api", package = "infernix-hubd" }

anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "fs", "sync", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev.package."*"]
opt-level = 1
