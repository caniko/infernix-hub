[ci]
provider = "actions"
platform = "github"
runtime = "nix"
runner = "ubuntu-latest"
workspace = true
workspace_strategy = "aggregate"
nix_builds = [".#packages.x86_64-linux.fleetix-hubd", ".#packages.x86_64-linux.hubctl"]

# The journey tests need a real PostgreSQL; they self-skip when
# HUB_TEST_DATABASE_URL is unset. simit has no service container support, so
# start the PostgreSQL shipped with the GitHub-hosted image and point the
# workspace tests at it.
extra_setup = ["sudo systemctl start postgresql.service", """sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'""""]
with_nix_cargo_cache = true
extra_env = { HUB_TEST_DATABASE_URL = "postgres://postgres:postgres@localhost:5432/postgres" }
